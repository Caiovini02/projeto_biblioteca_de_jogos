<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>{% block title %}Nimbox{% endblock %}</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/nimbox-icone.svg') }}" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,700;1,800&family=Barlow:wght@400;500;600;700&family=Righteous&family=Yellowtail&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/nimbox.css') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/mensagens.css') }}" />
    {% block css %}{% endblock %}
  </head>
  <body>
    {% include "partials/marca.html" %}
    {% block content %}{% endblock %}
    {% block scripts %}{% endblock %}
  </body>
</html>
